<title>FitQuest</title>
<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}

// ---------- Recalibración automática (últimas 4 semanas)
function recalibrate(){const R=S.stravaRuns||[],now=new Date(),lim=new Date(now);lim.setDate(lim.getDate()-28);const lk=ds(lim),nk=ds(now),rec=R.filter(r=>r.d>=lk&&r.d<=nk);
 if(!rec.length){S.cal=null;S.fbase=0;S.fref=undefined;return null}
 const b={p5:S.p5,lr:S.lr,w:S.rs?curWeek():null},km=rec.reduce((a,r)=>a+r.km,0),mn=rec.reduce((a,r)=>a+r.min,0),weekly=km/4,lr=Math.max(...rec.map(r=>r.km)),avg=mn/km;
 const eq=rec.filter(r=>r.km>=3).map(r=>r.pace*Math.pow(5/r.km,.06));let p5=S.p5||P5();
 if(rec.length>=3&&eq.length)p5=Math.round(Math.min(10,Math.max(3.5,(avg/1.2+Math.min(...eq))/2))*100)/100;
 const g=G[GK()],N=g.n;let w0=1;
 for(let w=1;w<N-2;w++){if(g.rec.includes(w))continue;const L=g.lg[w-1];if(L<=lr*1.15+1&&1.9*L<=weekly*1.25+8)w0=w}
 const daily=km*10/28,fref=Math.round(120*Math.min(2.2,Math.max(.8,daily/30))),fbase=Math.round(Math.min(25,daily/3)),m=mondayOf(new Date());m.setDate(m.getDate()-(w0-1)*7);
 S.p5=p5;S.lr=Math.round(lr*10)/10;S.rb=true;S.beg=false;S.rs=ds(m);RW=0;S.fbase=fbase;S.fref=fref;
 S.cal={n:rec.length,km4:Math.round(km),weekly:Math.round(weekly*10)/10,lr:Math.round(lr*10)/10,pace:pf(avg),p5,w0,fbase,fref,b};return S.cal}

function hSet(id,v){S.hlog=S.hlog||{};const k=ds(new Date());S.hlog[k]=S.hlog[k]||{};if(v)S.hlog[k][id]=true;else delete S.hlog[k][id];HLAST=id;save();buzz(15);habitsPage()}
function hDown(e,id){if(e.target.closest&&e.target.closest("button"))return;const fg=e.currentTarget;HD={id,fg,row:fg.parentNode,x:e.clientX,y:e.clientY,dx:0,drag:false,pid:e.pointerId};fg.style.transition="none"}
function hReset(){if(!HD)return;HD.fg.style.transition="";HD.fg.style.transform="";HD.row.classList.remove("swl","swr");HD=null}
function hMove(e){if(!HD||e.pointerId!==HD.pid)return;const dx=e.clientX-HD.x,dy=e.clientY-HD.y;
 if(!HD.drag){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){HD.drag=true;try{HD.fg.setPointerCapture(e.pointerId)}catch(_){}}else if(Math.abs(dy)>10){hReset();return}}
 if(HD.drag){HD.dx=Math.max(-140,Math.min(140,dx));HD.fg.style.transform="translateX("+HD.dx+"px)";HD.row.classList.toggle("swl",HD.dx<0&&!hDone(HD.id));HD.row.classList.toggle("swr",HD.dx>0&&hDone(HD.id))}}

function syncImported(){
 const R=S.stravaRuns||[];Object.keys(S.runs).forEach(k=>{if(S.runs[k]&&S.runs[k].src==="imp")delete S.runs[k]});
 const lim=new Date();lim.setDate(lim.getDate()-28);const lk=ds(lim),nk=ds(new Date()),by={};let n=0;
 R.forEach(r=>{(by[r.d]=by[r.d]||[]).push(r)});
 Object.keys(by).forEach(k=>{if(S.runs[k])return;
  const plan=runFor(k),recent=k>=lk&&k<=nk;if(!plan&&!recent)return;
  const km=Math.round(by[k].reduce((a,r)=>a+r.km,0)*100)/100,mn=Math.round(by[k].reduce((a,r)=>a+r.min,0)*10)/10,pace=km&&mn?" · ritmo "+pf(mn/km)+" min/km":"";
  let c="ok",m="✅ Carrera importada";
  if(plan){const v=plan.km?km:mn,ratio=v/(plan.km||plan.min);
   if(ratio>=.95)m="✅ ¡Sesión completada!";
   else if(ratio>=.75){c="wa";m="⚠️ Un poco por debajo ("+Math.round(ratio*100)+"% del plan). Si notas cansancio, baja el ritmo; lo importante es acabar."}
   else{c="bad";m="🔻 Por debajo del plan ("+Math.round(ratio*100)+"%). Descansa y, si lo necesitas, repite esta semana antes de avanzar."}
   if((plan.k==="easy"||plan.k==="long")&&km&&mn&&mn/km<6.8)m+=" Ibas rápido para un rodaje suave: frena para recuperar mejor."}
  m+='<br><span style="opacity:.85">'+km+" km · "+mn+" min"+pace+" · importada</span>";
  S.runs[k]={c,m,km,min:mn,src:"imp"};n++});
 syncDays();return n}

 const r=rp(w,i),q=S.rdraft[k]||{},kmD=num(q.km)||0,mn=num(q.min)||0,v=r.km?kmD:mn;
 if(!(v>0))return toast(r.km?"Introduce los km que has corrido.":"Introduce los minutos de la sesión.");
 const ratio=v/(r.km||r.min),pace=kmD&&mn?` · ritmo ${pf(mn/kmD)} min/km`:"";
 let c,m;
 if(ratio>=.95){c="ok";m="✅ ¡Sesión completada!"}
 else if(ratio>=.75){c="wa";m=`⚠️ Un poco por debajo (${Math.round(ratio*100)}% del plan). Si notas cansancio, baja el ritmo; lo importante es acabar.`}
 else{c="bad";m=`🔻 Por debajo del plan (${Math.round(ratio*100)}%). Descansa y, si lo necesitas, repite esta semana antes de avanzar.`}
 if((r.k==="easy"||r.k==="long")&&kmD&&mn&&mn/kmD<6.8)m+=" Ibas rápido para un rodaje suave: frena para recuperar mejor.";
 m+=`<br><span style="opacity:.85">${kmD?kmD+" km":""}${kmD&&mn?" · ":""}${mn?mn+" min":""}${pace}</span>`;
 const had=(S.badges||[]).slice();S.runs[k]={c,m,km:kmD,min:mn};syncDays();runAch(had);save();runPage();
}
setPlan();
try{if(localStorage.getItem("fq3r")){localStorage.removeItem("fq3r");setTimeout(()=>toast("Copia restaurada ✅"),700)}}catch(e){}
if(S&&S.v===3&&S.pg){if(S.stravaRuns&&S.stravaRuns.length){sortRuns();syncImported()}syncDays();if(!S.start){const f=[...S.days].sort()[0],t=ds(new Date());S.start=f&&f<t?f:t;save()}render()}else onboard();
